apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: miniflux
spec:
  ingressClassName: nginx
  rules:
  - host: rss.hyperserver.dev
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: miniflux
              port:
                number: 80
