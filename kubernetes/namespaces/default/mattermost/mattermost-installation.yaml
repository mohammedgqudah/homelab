apiVersion: installation.mattermost.com/v1beta1
kind: Mattermost
metadata:
  name: hyperchat
spec:
  size: 5000users
  # Routed by httproute.yml instead.
  ingress:
    enabled: false
  database:
    external:
      secret: mattermost-secret
  fileStore:
    external:
      url: s3-api.hyperserver.dev
      bucket: mattermost
      secret: mattermost-s3-secret
