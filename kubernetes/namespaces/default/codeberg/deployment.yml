apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeberg
spec:
  selector:
    matchLabels:
      app: codeberg
  template:
    metadata:
      labels:
        app: codeberg
    spec:
      containers:
        - image: codeberg.org/forgejo/forgejo:15.0.3
          imagePullPolicy: IfNotPresent
          name: codeberg
          env:
            - name: FORGEJO__service__DISABLE_REGISTRATION
              value: "true"
            - name: FORGEJO__service__REQUIRE_SIGNIN_VIEW
              value: "false"
            - name: FORGEJO__packages__ENABLED
              value: "true"
            - name: FORGEJO__openid__ENABLE_OPENID_SIGNIN
              value: "false"
            - name: FORGEJO__openid__ENABLE_OPENID_SIGNUP
              value: "false"
            - name: FORGEJO__server__LANDING_PAGE
              value: "explore"
          ports:
            - containerPort: 3000
              name: web
            - containerPort: 22
              name: git
          volumeMounts:
            - name: codeberg-data
              mountPath: /data
      volumes:
        - name: codeberg-data
          persistentVolumeClaim:
            claimName: codeberg-data
