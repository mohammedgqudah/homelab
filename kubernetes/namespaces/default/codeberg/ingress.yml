apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codeberg
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1000M"
spec:
  ingressClassName: nginx
  rules:
    - host: git.hyperserver.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: codeberg
                port:
                  name: web
