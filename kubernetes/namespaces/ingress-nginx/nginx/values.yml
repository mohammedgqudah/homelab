controller:
  config:
    enable-real-ip: true
    forwarded-for-header: cf-connecting-ip
    use-forwarded-headers: true
    allow-snippet-annotations: true
    annotations-risk-level: "Critical"
    use-http2: "false"
  metrics:
    enabled: true
    service:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "10254"
