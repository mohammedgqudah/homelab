groups:
- name: gateway
  rules:
  # Per host, from Envoy's virtual host stats (telemetry.metrics.enableVirtualHostStats
  # in namespaces/gateway/envoyproxy.yml). envoy_virtual_host is the generated
  # name gateway/public/http/<host with dots as underscores>.
  # this threshold may seem low, but I don't expect anyone to be using the services for now except for me
  - alert: GatewayHighRequestVolume
    expr: sum by (envoy_virtual_host) (increase(envoy_vhost_vcluster_upstream_rq_total[5m])) > 200
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High request volume on {{ $labels.envoy_virtual_host }}"
      description: "The gateway served more than 200 requests in the last 5 minutes."

      #- alert: GatewayLatencyHigh
